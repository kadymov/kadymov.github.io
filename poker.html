    return `${P.HAND_NAMES[cat]} ${rank(high)}`;
  }
  function seat(slot) {
    const p = game.players[slot.seat], active = !game.done && game.actor === slot.seat, result = payout(slot.seat);
    const title = `${p.name} ${p.stack || p.in_hand ? fmt(p.stack) : 'выбыл'}`, start = slot.col + Math.floor((slot.width - Array.from(fit(title, slot.width - 2)).length) / 2);
    frame.put(start, slot.row, fit(title, slot.width - 2)); if (active) frame.put(Math.max(slot.col, start - 2), slot.row, '●', C.blue);

  }
  function table() {
    addButton('info', 'i комбинации', 0, 0, 15, () => open('guide'), false);
    addButton('pause', 'Esc меню', grid.cols - 10, 0, 10, () => open('pause'), false);
    if (!tableFits()) { center(Math.floor(grid.rows / 2) - 1, 'Нужно больше строк'); center(Math.floor(grid.rows / 2) + 1, 'Поверните или увеличьте окно', C.muted); return; }

    const b = l.board, label = game.done ? `Роздано ${fmt(game.pot)}` : `${P.Game.STREETS[game.street]} · банк ${fmt(game.pot)}`;

    const total = 5 * b.cardWidth + 4, col = b.col + Math.floor((b.width - total) / 2);

    seat(l.human);
    let actions, status;
    if (game.done) { status = game.tournament_over ? game.players[0].stack ? 'Вы выиграли турнир' : 'Вы выбыли из турнира' : 'Раздача завершена'; actions = [['payouts', 'Выплаты', () => open('results')], ['next', game.tournament_over ? 'Новый турнир' : 'Дальше', nextHand]]; }
    else if (game.actor === 0) { const o = game.options(); status = o.call ? `Ваш ход · колл ${fmt(o.call)}` : 'Ваш ход · можно сделать чек'; actions = [['fold', 'Пас', () => act('fold')], ['call', o.call ? `Колл ${fmt(o.call)}` : 'Чек', () => act('call')]]; if (o.can_raise) actions.push(['raise', 'Рейз', showRaise]); }
    else { status = `${game.players[game.actor].name} думает…`; actions = []; center(l.actionsRow, status, C.muted); }
    if (l.statusRow !== null) center(l.statusRow, fit(status, grid.cols), C.muted);
    const step = Math.floor(grid.cols / Math.max(1, actions.length)); actions.forEach(([key, label, fn], i) => addButton(key, label, i * step, l.actionsRow, i === actions.length - 1 ? grid.cols - i * step : step, fn));
  }
  const titles = { table: 'Покерный стол', guide: 'Комбинации', pause: 'Пауза', raise: 'Рейз до', allin: 'Поставить все фишки?', results: 'Выплаты', restart: 'Начать заново?', error: 'Ошибка расчёта' };
  function page() {
    center(1, titles[view]);
    const col = Math.max(1, Math.floor((grid.cols - 54) / 2)), columns = grid.cols - col * 2;
    if (view === 'guide') {
      const examples = [['Роял-флеш', 'As Ks Qs Js Ts'], ['Стрит-флеш', '9h 8h 7h 6h 5h'], ['Каре', 'As Ah Ad Ac Ks'], ['Фулл-хаус', 'Ks Kh Kd 7c 7s'], ['Флеш', 'Ad Jd 8d 5d 2d'], ['Стрит', '9s 8h 7d 6c 5s'], ['Тройка', 'Qs Qh Qd 8c 3s'], ['Две пары', 'Js Jh 4d 4c As'], ['Пара', 'Ts Th Ad 8c 3s'], ['Старшая карта', 'As Jh 8d 5c 2s']];
      const lines = [];
      examples.forEach(([name, hand]) => { const cards = hand.split(' ').map(c => P.RANKS.indexOf(c[0]) * 4 + 'cdhs'.indexOf(c[1])); lines.push({ name, cards }); });
      const body = [];
      for (const line of lines) body.push({ ...line });
      body.push({ text: '' }, ...P.wrapCells('От сильной к слабой. Лучшая пятёрка из семи. Масти равны. При ничьей сравниваются кикеры.', columns).map(text => ({ text })));
      scroll = P.clamp(scroll, 0, Math.max(0, body.length - (grid.rows - 7)));
      body.slice(scroll, scroll + grid.rows - 7).forEach((line, i) => { const row = 4 + i; if (line.text !== undefined) frame.put(col, row, line.text, C.muted); else { frame.put(col, row, line.name); const start = col + columns - 14; line.cards.forEach((c, n) => frame.put(start + n * 3, row, cardText(c), [1, 2].includes(c % 4) ? C.red : C.text)); } });
      footer();
    } else if (view === 'pause') {
      addButton('resume', 'Продолжить', col, 4, columns, close);
      addButton('guide', 'Комбинации', col, 7, columns, () => open('guide'));
      addButton('restart', 'Новый турнир', col, 10, columns, () => open('restart'));
      addButton('fast', `${settings.fast ? '[×]' : '[ ]'} Быстрые ходы ботов`, col, 13, columns, () => { settings.fast = !settings.fast; save(); render(); });
      const content = [];
      for (const p of game.players.slice(1)) content.push(...P.wrapCells(`${p.name} · ${P.STYLES[p.style].description}.`, columns));
      content.push('', ...P.wrapCells(saveError || 'Партия и память сохраняются в браузере.', columns));
      const room = Math.max(0, grid.rows - 21); scroll = P.clamp(scroll, 0, Math.max(0, content.length - room)); content.slice(scroll, scroll + room).forEach((line, i) => frame.put(col, 17 + i, line, C.muted)); footer();
    } else if (view === 'raise') {
      const o = game.options(), dense = grid.rows < 22, amountRow = dense ? 3 : 5, trackRow = dense ? 5 : 8, presetRow = dense ? 7 : 11;
      const left = col, centerCol = col + Math.floor(columns / 2) - 6;
      addButton('minus', '−', left, amountRow, 4, () => setRaise(Number(raiseText) - game.bb));
      frame.center(centerCol, amountRow, 12, fit(raiseText + (selected === 'amount' ? '_' : ''), 12));
      buttons.push({ key: 'amount', label: 'Общая ставка за круг', type: 'number', col: centerCol, row: amountRow, columns: 12, nav: true });
      addButton('plus', '+', col + columns - 4, amountRow, 4, () => setRaise(Number(raiseText) + game.bb));
      const cells = columns - 2, pos = Math.round((cells - 1) * (P.clamp(Number(raiseText) || o.min_to, o.min_to, o.max_to) - o.min_to) / Math.max(1, o.max_to - o.min_to));
      frame.put(col + 1, trackRow, '─'.repeat(pos) + '◆' + '─'.repeat(cells - 1 - pos), C.muted);
      buttons.push({ key: 'range', label: 'Размер рейза', type: 'range', col, row: trackRow, columns, nav: false });
      const targets = [['Мин.', o.min_to], ['½ банка', game.players[0].committed + o.call + Math.round((game.pot + o.call) * .5)], ['Банк', game.players[0].committed + o.call + game.pot + o.call], ['Олл-ин', o.max_to]], step = Math.floor(columns / 4);
      targets.forEach(([label, n], i) => addButton('preset' + i, label, col + i * step, presetRow, i === 3 ? columns - i * step : step, () => setRaise(n)));
      frame.wrap(col, presetRow + 2, columns, raiseError || `Со стека: ${fmt((Number(raiseText) || 0) - game.players[0].committed)}. Ставка за круг: ${raiseText}.`, raiseError ? C.red : C.muted, Math.max(1, grid.rows - presetRow - 5));
      pair('Отмена', close, 'Поставить', submitRaise);
    } else if (view === 'allin') {
      frame.wrap(col, 5, columns, `В банк отправится ${fmt(Number(raiseText) - game.players[0].committed)}.`, C.muted);
      pair('Отмена', close, 'Поставить', () => { const n = Number(raiseText); close(); act('raise', n); });
    } else if (view === 'restart') {
      frame.wrap(col, 5, columns, 'Текущий турнир завершится. Память соперников сохранится.', C.muted);
      pair('Отмена', () => open('pause'), 'Начать', () => { game = new P.Game(); game.start_hand(); close(); update(); });
    } else if (view === 'results') {
      const lines = [];
      game.pot_results.forEach(r => { lines.push({ text: `${r.label} · ${fmt(r.amount)}`, color: C.text }); for (const [seat, amount] of Object.entries(r.payouts)) { const why = r.reason === 'return' ? 'возврат' : r.reason === 'fold' ? 'все сбросили' : P.describe_hand(r.rank); P.wrapCells(`${game.players[seat].name} получает ${fmt(amount)} · ${why}`, columns).forEach(text => lines.push({ text, color: r.reason === 'return' ? C.muted : C.orange })); } lines.push({ text: '' }); });
      P.wrapCells('Получено включает ваши вложенные фишки. Возврат показан отдельно.', columns).forEach(text => lines.push({ text, color: C.muted }));
      const room = grid.rows - 7; scroll = P.clamp(scroll, 0, Math.max(0, lines.length - room)); lines.slice(scroll, scroll + room).forEach((line, i) => frame.put(col, i + 4, line.text, line.color)); footer();
    } else if (view === 'error') { frame.wrap(col, 5, columns, aiError, C.red); addButton('retry', 'Повторить', col, grid.rows - 2, columns, close); }
  }
  function pair(left, leftFn, right, rightFn) { const half = Math.floor(grid.cols / 2); addButton('cancel', left, 0, grid.rows - 2, half, leftFn); addButton('confirm', right, half, grid.rows - 2, grid.cols - half, rightFn); }
  function footer() { addButton('up', '↑', 0, grid.rows - 2, 4, () => { scroll = Math.max(0, scroll - 3); render(); }); addButton('back', 'К столу', 4, grid.rows - 2, grid.cols - 8, close); addButton('down', '↓', grid.cols - 4, grid.rows - 2, 4, () => { scroll += 3; render(); }); }
  function render(sync = true) {
    if (!game || !width) return;
    frame = new P.Terminal(grid.cols, grid.rows); buttons = [];
    if (view === 'table') table(); else if (grid.rows >= 14 && grid.cols >= 28) page(); else { center(Math.floor(grid.rows / 2), 'Увеличьте окно', C.muted); if (view !== 'table') addButton('back', 'Назад', 0, Math.max(0, grid.rows - 2), grid.cols, close); }
    frame.paint(ctx, grid.originX, grid.originY, width, height);
    if (sync) syncControls();
  }
  function open(mode) { cancelAI(); if (mode === 'guide') returnView = view; view = mode; scroll = 0; selected = mode === 'pause' ? 'resume' : ['raise', 'allin'].includes(mode) ? 'confirm' : mode === 'restart' ? 'cancel' : 'back'; render(); }
  function close() { const next = view === 'guide' ? returnView : 'table'; view = next === 'guide' ? 'table' : next; scroll = 0; selected = view === 'pause' ? 'resume' : game.done ? 'next' : 'call'; render(); schedule(); }
  function validRaise() { const o = game.options(), n = Number(raiseText); return /^\d+$/.test(raiseText) && Number.isInteger(n) && n >= o.min_to && n <= o.max_to; }
  function validateRaise() { const o = game.options(); raiseError = validRaise() ? '' : `Допустимо ${fmt(o.min_to)}…${fmt(o.max_to)}`; }
  function setRaise(n) { const o = game.options(); raiseText = String(Math.round(P.clamp(Number.isFinite(n) ? n : o.min_to, o.min_to, o.max_to))); raiseError = ''; render(); }
  function showRaise() { if (game.done || game.actor !== 0 || !game.options().can_raise) return; raiseText = String(game.options().min_to); raiseError = ''; open('raise'); }
  function submitRaise() { validateRaise(); if (raiseError) { render(); return; } if (Number(raiseText) === game.options().max_to) open('allin'); else { const n = Number(raiseText); close(); act('raise', n); } }
  function failAI(message) { aiError = message; open('error'); }
  function act(action, amount) { if (view !== 'table' || game.done) return; try { game.act(action, amount); } catch (e) { aiError = e.message; open('error'); return; } update(); }
  function nextHand() { if (game.tournament_over) game = new P.Game(); game.start_hand(); update(); }
  function accessibleText() {
    const players = game.players.map((p, i) => `${p.name}: ${p.stack} фишек, ${!p.in_hand ? 'выбыл' : p.folded ? 'пас' : p.last || 'в игре'}${i === 0 || game.revealed && !p.folded ? ', карты ' + p.cards.map(cardText).join(' ') : ''}`).join('. ');
    return `Банк ${game.pot}. ${P.Game.STREETS[game.street]}. Стол: ${game.board.map(cardText).join(' ') || 'ещё не открыт'}. ${players}. ${game.done ? game.results.join('. ') : ''}`;
  }
  function update() { save(); selected = game.done ? 'next' : 'call'; canvas.setAttribute('aria-label', accessibleText()); $('status').textContent = game.done ? game.results.join('. ') : game.actor === 0 ? 'Ваш ход' : game.players[game.actor].name + ' думает'; render(); schedule(); }

  });

  let touchY = null;
  canvas.addEventListener('pointerdown', e => { touchY = e.clientY; });
  canvas.addEventListener('pointerup', e => { if (touchY !== null && view !== 'table' && view !== 'raise' && Math.abs(e.clientY - touchY) > P.CELL.height) { scroll = Math.max(0, scroll + Math.round((touchY - e.clientY) / P.CELL.height)); render(); } touchY = null; });

})();

;
</script>
