<body>
<main class="studio">
  <header class="masthead">
    <div class="brand"><h1>NOCTURNE</h1><button class="compose-button" id="compose" aria-pressed="true" title="Переключить автокомпозицию и ручную игру"><span class="button-led" aria-hidden="true"></span><span id="compose-label">Автокомпозиция</span><span class="chevron" aria-hidden="true"></span></button></div>
    <details class="extras" id="extras"><summary aria-label="Настройки звука"><span></span><span></span><span></span></summary><div class="extras-panel">
      <button class="power" id="power" aria-pressed="false"><span id="power-text">Включить звук</span></button>
      <div class="status" id="status"><span id="status-text">ЗВУК ВЫКЛЮЧЕН</span></div>
      <div><label class="slider-label" for="brightness">Яркость <output id="brightness-value" for="brightness">467 Гц</output></label><input id="brightness" type="range" min="0" max="100" value="30" step="1"></div>
      <div><label class="slider-label" for="space">Пространство <output id="space-value" for="space">62%</output></label><input id="space" type="range" min="0" max="100" value="62" step="1"></div>
      <div class="extra-row"><div class="octave"><button id="octave-down" aria-label="На октаву ниже">−</button><span class="octave-label" id="octave-label">C2–C4</span><button id="octave-up" aria-label="На октаву выше">+</button></div><button class="small-button" id="hold" aria-pressed="false" disabled>Удержание</button></div>
      <div class="extra-meta"><span id="polyphony-label">24 ГОЛОСА · СТЕРЕО</span><span id="voice-count">00 / 24</span></div>
    </div></details>
  </header>
  <div class="instrument">
    <section class="field-section" aria-labelledby="field-title">
      <!-- Artwork: nocturne-glass.png; generated with the built-in imagegen tool.
Final prompt: Use case: background-extraction. Asset type: isolated decorative glass sculpture for a working HTML synthesizer. Input image is the design reference. Extract/re-create ONLY the large cobalt blue, transparent crystal and warm amber glass twisted loop sculpture from the upper half of the reference. Match its premium photorealistic material, elegant organic slightly triangular torus silhouette, specular highlights, refracted sunlight and liquid folds. One complete loop centered in a square canvas with a generous large empty hole in its center (about 38% of full object width) for an XY control. Entire background AND the center hole genuinely transparent, no cream rectangle. All text, title, grid, UI, dots, controls, notes and symbols removed. No letters anywhere. Keep the glass object whole, no clipping, about 5% transparent margin. Pale warm contact glow allowed but no opaque background or hard shadow. This is a reusable cutout asset, not an app screenshot.
-->
      <div class="hero"><img class="glass-form" id="glass-form" src="nocturne-glass.png" alt="" aria-hidden="true" draggable="false"><div class="field-center"><h2 class="field-title" id="field-title">Поле звучания</h2><div class="xy" id="xy" role="group" aria-label="Яркость и пространство. Ползунки доступны в настройках звука."><canvas id="scope" aria-hidden="true"></canvas><div class="cross-h" id="cross-h"></div><div class="cross-v" id="cross-v"></div><div class="puck" id="puck"></div></div><span class="axis axis-y">Пространство →</span><span class="axis axis-x">Яркость →</span></div></div>
      <div class="drift-controls"><button class="drift-button" id="drift" aria-pressed="true" title="Автодвижение поля"><span class="button-led" aria-hidden="true"></span>Автодвижение</button><div class="period-select"><select id="drift-period" aria-label="Период автодвижения"></select></div></div>
    </section>
    <section class="performance" aria-label="Гармония"><div class="notes" id="notes" aria-label="Текущий аккорд" aria-live="polite">Cm9</div><div class="harmony-control"><label for="harmony-mode">Лад / аккорд</label><select id="harmony-mode" aria-describedby="harmony-help"></select></div><button class="stop" id="stop" title="Остановить ноты и эффекты (Escape)"><span class="stop-circle" aria-hidden="true"><span class="stop-symbol"></span></span><span>Стоп</span></button></section>
    <section class="sound-section" aria-label="Характер звука"><div class="knobs" id="knobs"></div></section>
    <section class="composition" aria-label="Развитие композиции">
      <div class="macro"><label class="slider-label" for="density">Плотность <output id="density-value" for="density">80%</output></label><input id="density" type="range" min="0" max="100" step="1" value="80" style="--fill:80%"></div>
      <div class="macro"><label class="slider-label" for="variety">Разнообразие <output id="variety-value" for="variety">60%</output></label><input id="variety" type="range" min="0" max="100" step="1" value="60" style="--fill:60%"></div>
    </section>

  $('octave-down').addEventListener('click',()=>changeOctave(-1));$('octave-up').addEventListener('click',()=>changeOctave(1));
  document.addEventListener('pointerdown',e=>{if(!$('extras').contains(e.target))$('extras').open=false;});
  document.addEventListener('keydown',e=>{
    if(e.code==='Escape'){e.preventDefault();$('extras').open=false;stopAll();return;}
    if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.target?.closest?.('input,select,textarea,[contenteditable=true]'))return;
    const offset=keyCodes.indexOf(e.code);if(offset<0)return;e.preventDefault();activate('key:'+e.code,(octave+1)*12+offset);
  });
  document.addEventListener('keyup',e=>{if(keyCodes.includes(e.code)){e.preventDefault();deactivate('key:'+e.code);}});
  function releasePhysical(){for(const source of [...sources.keys()])deactivate(source);}
  window.addEventListener('blur',releasePhysical);document.addEventListener('visibilitychange',()=>{if(document.hidden)releasePhysical();});
  window.addEventListener('pagehide',()=>stopAll(true));renderKeys();

  const canvas=$('scope'),draw=canvas.getContext('2d');let width=1,height=1,last=0,data=new Float32Array(2048),freq=new Uint8Array(1024);
  function resize(){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);width=r.width;height=r.height;canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);draw.setTransform(dpr,0,0,dpr,0,0);}
  new ResizeObserver(resize).observe(canvas);resize();
  function frame(now){requestAnimationFrame(frame);if(document.hidden||now-last<(reduced.matches?250:33))return;last=now;draw.clearRect(0,0,width,height);
    if(!engine||!powered||context.state!=='running')return;
    if(driftEnabled)syncField(engine.fieldPosition());
    engine.analyser.getFloatTimeDomainData(data);engine.analyser.getByteFrequencyData(freq);
    // Spectrum and waveform are both read from the actual post-volume audio output.
    const count=60,barWidth=width/count;
    for(let i=0;i<count;i++){const bin=Math.floor(Math.pow(i/(count-1),2)*250);const a=freq[bin]/255;draw.fillStyle='rgba(6,75,255,'+(a*.15)+')';draw.fillRect(i*barWidth,height/2-a*height*.34,Math.max(1,barWidth-2),a*height*.68);}
    draw.beginPath();for(let i=0;i<width;i++){const value=data[Math.floor(i/width*data.length)];const y=height/2+value*height*1.4;i?draw.lineTo(i,y):draw.moveTo(i,y);}draw.strokeStyle='rgba(6,75,255,.65)';draw.lineWidth=1;draw.stroke();
  }
  requestAnimationFrame(frame);
})();
</script>
